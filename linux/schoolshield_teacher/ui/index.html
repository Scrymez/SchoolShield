<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Центр учителя</title>
<style>
:root {
  /* the colours of интеллектшкола.рф: purple #7e22ce to indigo #4338ca on white and lilac */
  --bg: #f9f7ff; --side: #f3edff; --card: #ffffff; --card2: #f3e8ff; --line: #ded7f0; --text: #1f2937; --muted: #586073;
  --accent: #7e22ce; --accent2: #4338ca; --on-accent: #ffffff; --ok: #059669; --warn: #b45309; --bad: #be123c;
  --grad: linear-gradient(90deg, #7e22ce, #4338ca); --sel: #ede0f8; --sel2: #dcc4f3; --ring: rgba(126, 34, 206, .22); --okbg: #e3f5ee; --radius: 1.1rem; --shadow: 0 .6rem 1.8rem rgba(76, 29, 149, .14);
}
:root[data-theme="dark"] {
  --bg: #151130; --side: #0e0b22; --card: #231d4e; --card2: #342b70; --line: #423980; --text: #f3f4f6; --muted: #b0aad6;
  --accent: #c084fc; --accent2: #818cf8; --ok: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --grad: linear-gradient(90deg, #9333ea, #4f46e5); --sel: #392b66; --sel2: #4c3a85; --ring: rgba(192, 132, 252, .3); --okbg: #1d3a45; --shadow: 0 .6rem 1.8rem rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale, 1.2)); height: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.45 Inter, "Noto Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 15.5rem 1fr; height: 100vh; }
@media (max-width: 1000px) { .app { grid-template-columns: 4.6rem 1fr; } .nav .lbl, .brand span, .side .foot { display: none; } .nav { justify-content: center; padding: .8rem 0; } .nav .dot { display: none; } .bell { display: none; } }
/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 1rem .7rem; gap: .25rem; overflow: auto; }
.brand { display: flex; align-items: center; gap: .65rem; padding: .3rem .6rem 1.1rem; font-weight: 800; font-size: 1.15rem; }
.brand svg { width: 2.2rem; height: 2.2rem; flex: none; }
.nav { position: relative; display: flex; align-items: center; gap: .8rem; width: 100%; padding: .75rem .8rem; border: 0; background: transparent; border-radius: .8rem; text-align: left; font-size: 1rem; font-weight: 500; transition: background .18s, transform .18s; }
.nav svg { width: 1.35rem; height: 1.35rem; flex: none; opacity: .8; }
.nav:hover { background: var(--card2); transform: translateX(.15rem); }
.nav.active { background: var(--grad); color: #fff; font-weight: 700; box-shadow: var(--shadow); }
.nav.active svg { opacity: 1; }
.nav .dot { margin-left: auto; width: .6rem; height: .6rem; border-radius: 50%; background: var(--ok); }
.nav .dot.off { background: var(--warn); }
.grow { flex: 1; }
.side .foot { color: var(--muted); font-size: .75rem; padding: .5rem .8rem 0; }
/* main */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.top { display: flex; align-items: center; gap: 1rem; padding: .9rem 1.6rem; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 1.5rem; white-space: nowrap; letter-spacing: -.01em; animation: rise .35s both; }
.search { flex: 1; max-width: 32rem; min-width: 11rem; position: relative; }
.search input { width: 100%; padding: .65rem 1rem .65rem 2.6rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 .25rem var(--ring); }
.search svg { position: absolute; left: .85rem; top: .7rem; width: 1.2rem; height: 1.2rem; color: var(--muted); }
.bell { color: var(--muted); font-size: .9rem; white-space: nowrap; }
.bell b { color: var(--text); }
.clock { font-size: 1.5rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.content { flex: 1; overflow: auto; padding: 1.5rem 1.6rem 3rem; }
.content > div { animation: rise .35s both; }
@keyframes rise { from { opacity: 0; transform: translateY(.7rem); } }
h2 { margin: 0 0 .8rem; font-size: 1.2rem; }
.sub { color: var(--muted); margin: -.4rem 0 1rem; }
.row { display: flex; gap: .8rem; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem; }
/* hero, like the school's website */
.hero { position: relative; overflow: hidden; border-radius: 1.5rem; padding: 1.8rem 2rem; color: #fff; margin-bottom: 1.2rem; background: linear-gradient(120deg, #312e81 0%, #1e40af 50%, #581c87 100%); box-shadow: var(--shadow); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 999px; background: rgba(255, 255, 255, .13); }
.hero::before { width: 14rem; height: 5rem; right: 6rem; top: 1rem; transform: rotate(-12deg); }
.hero::after { width: 9rem; height: 9rem; right: -2rem; bottom: -3rem; }
.hero .big { font-size: 2rem; font-weight: 800; position: relative; }
.hero .what { opacity: .85; position: relative; margin-top: .2rem; font-size: 1.1rem; }
.chips { display: flex; gap: .55rem; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--text); font-size: .95rem; font-weight: 600; transition: background .15s, transform .15s; }
button.chip:hover { background: var(--card2); transform: translateY(-1px); }
.chip .d { width: .7rem; height: .7rem; border-radius: 50%; background: var(--muted); }
.chip.ok .d { background: var(--ok); } .chip.warn .d { background: var(--warn); }
.chip.active { background: var(--grad); color: #fff; border-color: transparent; }
/* big tiles of the home page */
.big-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 1rem; margin-bottom: 1.6rem; }
.big-tile { display: flex; align-items: center; gap: 1.1rem; padding: 1.15rem 1.3rem; background: var(--card); border: 1.5px solid var(--line); border-radius: 1.3rem; text-align: left; box-shadow: 0 .2rem .8rem rgba(76, 29, 149, .06); transition: transform .18s, box-shadow .18s, border-color .18s; animation: rise .45s both; }
.big-tile:hover { transform: translateY(-.25rem); border-color: var(--accent); box-shadow: var(--shadow); }
.big-tile:active { transform: scale(.98); }
.big-tile .ic { width: 4.2rem; height: 4.2rem; flex: none; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; }
.big-tile .ic svg { width: 2rem; height: 2rem; }
.big-tile .t { font-size: 1.15rem; font-weight: 800; }
.big-tile .s { color: var(--muted); font-size: .92rem; margin-top: .15rem; }
/* small tiles (programs) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.4rem, 1fr)); gap: .9rem; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: 1.1rem .6rem .9rem; background: var(--card); border: 1.5px solid var(--line); border-radius: 1.1rem; text-align: center; min-height: 8rem; transition: transform .15s, border-color .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-.2rem); border-color: var(--accent); box-shadow: var(--shadow); }
.tile .ico { width: 3.3rem; height: 3.3rem; display: grid; place-items: center; border-radius: .9rem; overflow: hidden; background: var(--card2); font-weight: 800; font-size: 1.4rem; color: var(--accent); }
.tile .ico img { width: 3.3rem; height: 3.3rem; object-fit: contain; }
.tile .nm { font-size: .9rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.tile .star { position: absolute; top: .3rem; right: .3rem; width: 1.8rem; height: 1.8rem; border-radius: .5rem; border: 0; background: transparent; color: var(--muted); opacity: 0; font-size: 1.1rem; }
.tile:hover .star, .tile .star.on { opacity: 1; }
.tile .star.on { color: var(--warn); }
.tile .badge { position: absolute; top: .45rem; left: .45rem; font-size: .62rem; padding: .1rem .4rem; border-radius: .4rem; background: var(--card2); color: var(--muted); }
.list { display: flex; flex-direction: column; gap: .5rem; }
.item { display: flex; align-items: center; gap: .9rem; padding: .7rem .9rem; background: var(--card); border: 1px solid var(--line); border-radius: .85rem; width: 100%; text-align: left; transition: background .12s, border-color .12s; }
.item:hover { background: var(--card2); }
.item .ic { width: 2.2rem; height: 2.2rem; border-radius: .6rem; background: var(--card2); display: grid; place-items: center; color: var(--accent); flex: none; }
.item .ic svg { width: 1.2rem; height: 1.2rem; }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: .55rem; padding: .7rem 1.2rem; border-radius: .85rem; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; transition: transform .15s, box-shadow .15s, background .15s; }
.btn svg { width: 1.2rem; height: 1.2rem; flex: none; }
.btn:hover { background: var(--card2); transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--grad); color: #fff; border-color: transparent; font-weight: 700; }
.btn.primary:hover { box-shadow: 0 .5rem 1.2rem var(--ring); }
.btn.danger { color: var(--bad); }
.btn.on { border-color: var(--accent); background: var(--sel); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.field { padding: .65rem .85rem; border-radius: .75rem; border: 1.5px solid var(--line); background: var(--card); outline: none; min-width: 0; }
.field:focus { border-color: var(--accent); }
textarea.field { width: 100%; min-height: 12rem; font: .85rem/1.5 "DejaVu Sans Mono", monospace; resize: vertical; }
.muted { color: var(--muted); } .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.status { display: grid; grid-template-columns: 1.5rem 1fr; gap: .4rem .8rem; align-items: start; padding: .65rem 0; border-bottom: 1px solid var(--line); }
.status:last-child { border-bottom: 0; }
.slider { width: 100%; accent-color: var(--accent); height: 1.8rem; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
pre.log { background: #0b0820; color: #a7f3d0; padding: .8rem; border-radius: .7rem; font-size: .8rem; max-height: 15rem; overflow: auto; white-space: pre-wrap; margin: .6rem 0 0; }
.toast { position: fixed; right: 1.4rem; bottom: 1.4rem; display: flex; flex-direction: column; gap: .5rem; z-index: 90; }
.toast div { background: var(--card); border: 1.5px solid var(--accent); border-radius: .9rem; padding: .75rem 1.1rem; box-shadow: var(--shadow); max-width: 26rem; animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { transform: translateY(.8rem) scale(.96); opacity: 0; } }
.modal { position: fixed; inset: 0; background: rgba(21, 17, 48, .55); display: grid; place-items: center; z-index: 80; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal .box { background: var(--card); border: 1px solid var(--line); border-radius: 1.2rem; padding: 1.5rem; width: min(30rem, 92vw); box-shadow: var(--shadow); animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
.modal h3 { margin: 0 0 .4rem; font-size: 1.25rem; }
.modal .acts { display: flex; gap: .7rem; justify-content: flex-end; margin-top: 1.2rem; }
.empty { padding: 2.5rem; text-align: center; color: var(--muted); }
/* file manager */
.fm { display: grid; grid-template-columns: 15rem 1fr; gap: 1rem; height: calc(100vh - 8.2rem); min-height: 22rem; }
@media (max-width: 1000px) { .fm { grid-template-columns: 11rem 1fr; } }
.places { display: flex; flex-direction: column; gap: .25rem; overflow: auto; padding-right: .2rem; }
.places h4 { margin: .6rem .6rem .2rem; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
.place { position: relative; display: flex; align-items: center; gap: .7rem; padding: .6rem .7rem; border: 1.5px solid transparent; background: transparent; border-radius: .8rem; text-align: left; transition: background .15s, border-color .15s; }
.place svg { width: 1.3rem; height: 1.3rem; flex: none; color: var(--accent); }
.place .pt { flex: 1; min-width: 0; }
.place .pt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place .pt small { color: var(--muted); font-size: .75rem; }
.place:hover { background: var(--card2); }
.place.active { background: var(--sel); border-color: var(--accent); }
.place.drop, .fmrow.drop { background: var(--sel2); border-color: var(--accent); }
.place .eject { width: 2rem; height: 2rem; border-radius: 50%; border: 0; background: var(--line); display: grid; place-items: center; color: var(--muted); }
.place .eject:hover { background: var(--sel2); color: var(--bad); }
.place .eject svg { width: 1rem; height: 1rem; color: inherit; }
.fmmain { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tools { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .6rem; }
.tools .btn { padding: .4rem .75rem; font-size: .92rem; gap: .4rem; }
.tools .btn svg { width: 1.05rem; height: 1.05rem; }
.crumbs { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; margin-bottom: .6rem; }
.crumbs button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: .3rem .8rem; font-weight: 500; }
.crumbs button:last-child { background: var(--sel); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.crumbs button:hover { background: var(--card2); }
.crumbs i { color: var(--muted); font-style: normal; }
.fmlist { flex: 1; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: .3rem; min-height: 8rem; }
.fmlist.drop { outline: 2.5px dashed var(--accent); outline-offset: -.4rem; }
.fmrow { display: grid; grid-template-columns: 1.7rem 2.2rem 1fr 7rem 9rem; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: .7rem; border: 1.5px solid transparent; user-select: none; }
.fmrow .chk { width: 1.3rem; height: 1.3rem; border-radius: .35rem; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: .85rem; }
.fmrow:hover { background: var(--card2); }
.fmrow.sel { background: var(--sel); border-color: var(--accent); }
.fmrow.sel .chk { background: var(--grad); border-color: transparent; color: #fff; }
.fmrow .ic { width: 2.1rem; height: 2.1rem; border-radius: .6rem; background: var(--card2); display: grid; place-items: center; color: var(--accent); }
.fmrow .ic svg { width: 1.2rem; height: 1.2rem; }
.fmrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.fmrow .m { color: var(--muted); font-size: .85rem; white-space: nowrap; text-align: right; }
@media (max-width: 1000px) { .fmrow { grid-template-columns: 1.7rem 2.2rem 1fr 6rem; } .fmrow .m:last-child { display: none; } }
.fmstatus { color: var(--muted); padding: .5rem .3rem 0; font-size: .9rem; }
.jobbar { margin-top: .6rem; padding: .8rem 1rem; border-radius: 1rem; background: var(--card); border: 1.5px solid var(--accent); display: none; align-items: center; gap: 1rem; animation: rise .25s both; }
.jobbar.show { display: flex; }
.jobbar .jt { flex: 1; min-width: 0; }
.jobbar .jt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: .6rem; border-radius: 999px; background: var(--line); margin-top: .4rem; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 999px; transition: width .25s; }
.jobbar.done { border-color: var(--ok); } .jobbar.fail { border-color: var(--bad); }
/* settings, wifi, help */
.set { margin-bottom: 1.6rem; }
.set h2 { display: flex; align-items: center; gap: .6rem; }
.set .hint { color: var(--muted); margin: -.3rem 0 .7rem; }
.wifirow { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; border-radius: 1.1rem; border: 1.5px solid var(--line); background: var(--card); margin-bottom: .6rem; animation: rise .35s both; }
.wifirow.on { border-color: var(--ok); background: var(--okbg); }
.bars { display: flex; align-items: flex-end; gap: .18rem; height: 1.6rem; }
.bars i { width: .38rem; border-radius: .12rem; background: var(--line); }
.bars i.on { background: var(--accent); }
.wifirow .wt { flex: 1; min-width: 0; }
.wifirow .wt b { font-size: 1.1rem; }
details.help { background: var(--card); border: 1.5px solid var(--line); border-radius: 1.1rem; margin-bottom: .6rem; overflow: hidden; transition: border-color .2s; }
details.help[open] { border-color: var(--accent); }
details.help summary { list-style: none; padding: 1rem 1.2rem; font-weight: 700; font-size: 1.1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
details.help summary::-webkit-details-marker { display: none; }
details.help summary::after { content: "⌄"; color: var(--accent); font-size: 1.4rem; transition: transform .25s; }
details.help[open] summary::after { transform: rotate(180deg); }
details.help .body { padding: 0 1.2rem 1.1rem; white-space: pre-line; animation: rise .25s both; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><path d="M12 2l8.5 3.2v6.3c0 5.2-3.6 8.6-8.5 10.5-4.9-1.9-8.5-5.3-8.5-10.5V5.2z" fill="url(#lg)"/><path d="M8.2 12.2l2.7 2.7 5-5.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Центр учителя</span></div>
    <nav id="nav" style="display:flex;flex-direction:column;gap:4px"></nav>
    <div class="grow"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="pageTitle">Главная</h1>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Поиск программ и файлов…" autocomplete="off"></div>
      <div class="grow"></div>
      <div class="bell" id="bell"></div>
      <button class="btn" id="sizeBtn" title="Размер букв: нажимайте, пока не станет удобно" style="font-weight:800">A++</button>
      <div class="clock" id="clock">--:--</div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  apps: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  docs: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/>',
  media: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
  files: '<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  folder: '<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',

function tickClock() {
  const d = new Date();
  $("#clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const bells = (S.state && S.state.bells) || [];
  const now = d.getHours() * 60 + d.getMinutes();
  const mins = (s) => { const [a, b] = s.split(":"); return (+a) * 60 + (+b); };
  let txt = "";
  for (let i = 0; i < bells.length; i++) {
    const a = mins(bells[i].start), b = mins(bells[i].end);
    if (now >= a && now < b) { txt = "<b>" + bells[i].title + "</b> · до " + bells[i].end + " (ещё " + (b - now) + " мин)"; break; }
    if (now < a) { txt = (i === 0 ? "До начала: " : "Перемена · ") + "<b>" + bells[i].title + "</b> в " + bells[i].start; break; }
  }
  $("#bell").innerHTML = txt;
}

async function boot() {
  buildNav();
  S.state = await api("/api/state");
  S.prefs = Object.assign({ theme: "light", size: "large", favorites: [] }, S.state.prefs);
  $("#foot").textContent = "v" + S.state.version + " · " + S.state.author;
  document.title = S.state.title;
  applyLook();
  $("#sizeBtn").addEventListener("click", () => { setSize(S.prefs.size === "normal" ? "large" : S.prefs.size === "large" ? "huge" : "normal"); });
  $("#q").addEventListener("input", (e) => {
    S.query = e.target.value;
    if (S.query && !["apps", "docs", "media", "files"].includes(S.section)) go("apps");
    else if (S.section === "files") fsLoad();
    else render();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); $("#q").focus(); } });
  tickClock(); setInterval(tickClock, 15000);
  setInterval(() => api("/api/heartbeat", {}).catch(() => {}), 10000);
  api("/api/apps").then((a) => { S.apps = a; if (S.section === "home" || S.section === "apps") render(); });
  api("/api/protection").then((p) => { S.prot = p; const d = $("#protDot"); if (d) d.className = "dot" + (p.applied ? "" : " off"); }).catch(() => {});
  go("home");
}
boot().catch((e) => { document.body.innerHTML = "<p style='padding:30px;font-family:sans-serif'>Центр учителя не запустился: " + e.message + "</p>"; });
